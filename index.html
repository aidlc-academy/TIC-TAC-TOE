<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tic-Tac-Toe</h1>

    <!-- Mode selector -->
    <div class="mode-selector">
      <button id="btn-two-player" class="mode-btn active">2 Players</button>
      <button id="btn-vs-ai" class="mode-btn">vs AI</button>
    </div>

    <!-- Status message -->
    <p id="status" class="status">Player X's turn</p>

    <!-- Board -->
    <div id="board" class="board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">X</span>
        <span id="score-x" class="score-value">0</span>
      </div>
      <div class="score-box draws">
        <span class="score-label">Draws</span>
        <span id="score-draw" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">O</span>
        <span id="score-o" class="score-value">0</span>
      </div>
    </div>

    <button id="btn-restart" class="restart-btn">Restart</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
